# リリースに「署名済みの配布 zip」と「署名ファイル」が揃っているかを点検する。★v2.10.0
#
# 2.10.0 から、各サイトは更新を入れる前に zip の署名を確かめる（includes/class-update-verify.php）。
# 署名は集中管理側（WPSM）の秘密鍵でしか作れないので、zip は手元の tools/release.sh で作って署名し、
# 署名ファイルと一緒にリリースへ載せる。
#
# 以前はここで zip を作って添付していたが、作り直すと中身が変わって署名と合わなくなる。
# そのため、ここでは作らず・上書きもせず、揃っているかと中のフォルダ名だけを確かめる。
# 揃っていないリリースは、各サイトが更新として受け付けない（＝安全側）が、
# 作業漏れに気づけるよう、このジョブを失敗させて知らせる。
name: Check signed install zip

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ github.event.release.tag_name }}"
          ZIP="wp-security-guard-${VER}-install.zip"
          NAMES=$(gh release view "$VER" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$NAMES"
          echo "$NAMES" | grep -qx "$ZIP"       || { echo "::error::$ZIP がありません（tools/release.sh で作成してください）"; exit 1; }
          echo "$NAMES" | grep -qx "$ZIP.sig"   || { echo "::error::$ZIP.sig（署名）がありません。各サイトはこの更新を受け付けません"; exit 1; }

      - name: Verify top-level folder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ github.event.release.tag_name }}"
          gh release download "$VER" --repo "${{ github.repository }}" --pattern "wp-security-guard-${VER}-install.zip"
          TOP=$(unzip -l "wp-security-guard-${VER}-install.zip" | awk 'NR>3 {print $4}' | grep -v '^$' | cut -d/ -f1 | sort -u)
          echo "top-level: $TOP"
          # フォルダ名が違うと管理画面で別プラグイン扱いになる。
          test "$TOP" = "wp-security-guard"
